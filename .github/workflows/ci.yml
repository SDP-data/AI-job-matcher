name: CI

on:
  push:
    branches:
      - main
      - feature/ai-job-matcher-v2
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build -d

      - name: Check running containers
        run: docker ps

      - name: Validate API container
        run: docker compose exec -T api python -c "from app.main import app; print(app.title)"

      - name: Stop services
        if: always()
        run: docker compose down
